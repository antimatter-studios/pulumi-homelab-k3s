name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: install
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Programs that link the Node.js SDK from a checkout run this same install, so that the SDK
      # finds what it imports.
      - name: Install
        run: pnpm install --frozen-lockfile

  go:
    # The Go provider plugin. It lives in its own module under provider/, so everything here runs
    # from there.
    name: go
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.150.0

      - name: SDK is up to date
        working-directory: .
        run: |
          ./scripts/gen-sdk.sh
          git diff --exit-code -- sdk/nodejs
          test -z "$(git status --porcelain -- sdk/nodejs)"

      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.150.0

      - name: SDK is up to date
        working-directory: .
        run: |
          ./scripts/gen-sdk.sh
          git diff --exit-code -- sdk/go
          test -z "$(git status --porcelain -- sdk/go)"

      - name: Build Go SDK
        working-directory: sdk/go
        run: go build ./...

      - name: Release dry run
        # What the next merge to main would release, computed from the real history, and its notes.
        # A changelog.d fragment with a name the notes cannot place fails here, not at release time.
        working-directory: .
        run: |
          git fetch --tags --unshallow --quiet || git fetch --tags --quiet
          next="$(./scripts/release.sh next)"
          echo "next release: $next"
          ./scripts/release.sh notes

  ci:
    # The single name main requires. Jobs above can be renamed, split into a matrix or made
    # conditional without stranding a merge, because this one always runs and reports.
    name: CI
    needs: [install, go]
    if: always()
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs
        run: |
          for result in 'install:${{ needs.install.result }}' 'go:${{ needs.go.result }}'; do
            case "${result#*:}" in
              success|skipped) ;;
              *) echo "$result"; exit 1 ;;
            esac
          done
